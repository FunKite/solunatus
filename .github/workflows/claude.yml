name: Claude

# On-demand help from Claude Fable 5.2. Runs only when the repository owner,
# or Codex on a pull request from this repository, mentions @claude in an
# issue, a PR comment or a PR review. Shared rules: AGENTS.md (via CLAUDE.md).
#
# - Issues and pull requests from branches in this repository: full mode.
#   Claude can build and test, and works on a claude/ branch. It never merges.
# - Pull requests from forks: skipped. External contributions are not accepted,
#   and the fork-review path is disabled until it has safe live validation.
# - Codex (chatgpt-codex-connector[bot]): pull requests from this repository
#   only, and at most CODEX_CALL_LIMIT calls per pull request. Claude is told
#   never to mention Codex, so the two agents cannot loop.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    # Public repo: only the owner's own account can start Claude, plus Codex
    # (ChatGPT's GitHub app) on pull requests. Fork and cap checks are below.
    if: |
      (github.actor == github.repository_owner && (
      (github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.author_association == 'OWNER' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        github.event.issue.author_association == 'OWNER' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))) ||
      (github.actor == 'chatgpt-codex-connector[bot]' && (
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.review.body, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Pick full or skip
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          CODEX: chatgpt-codex-connector[bot]
          # Claude answers at most this many @claude calls from Codex per pull request.
          CODEX_CALL_LIMIT: "3"
          EVENT_AT: ${{ github.event.comment.created_at || github.event.review.submitted_at || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          set -euo pipefail
          mode=full
          if [[ -n "${PR_NUMBER}" ]]; then
            head_repo="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name // ""')"
            # A deleted fork has no head repo; treat anything not this repo as a fork.
            if [[ "${head_repo}" != "${REPO}" ]]; then
              echo "Fork pull request: Claude is disabled pending safe live validation."
              mode=skip
            fi
          fi

          if [[ "${ACTOR}" == "${CODEX}" ]]; then
            if [[ -z "${PR_NUMBER}" || "${mode}" != "full" || -z "${EVENT_AT}" ]]; then
              echo "Codex can call Claude only on pull requests from this repository."
              mode=skip
            else
              # Codex's @claude calls on this pull request up to and including this one.
              filter='.[] | select(.user.login == env.CODEX)
                | select(((.body // "") | test("@claude"; "i")) and ((.created_at // .submitted_at // "") <= env.EVENT_AT))
                | 1'
              # Fail closed if any page request fails; Bash clears errexit
              # inside command substitutions, so later calls could hide errors.
              calls="$( {
                gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq "${filter}" || exit 1
                gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/comments" --jq "${filter}" || exit 1
                gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --jq "${filter}" || exit 1
              } | wc -l )"
              echo "Codex @claude calls on this pull request: ${calls} (limit ${CODEX_CALL_LIMIT})"
              if (( calls > CODEX_CALL_LIMIT )); then
                echo "Limit reached; Claude will not answer. The owner can still comment @claude."
                mode=skip
              fi
            fi
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Mode: ${mode}"

  claude:
    needs: route
    if: needs.route.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # actions/checkout v7 (same pin as the other workflows; see Pin Drift Check)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # dtolnay/rust-toolchain stable (same pin as the other workflows)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy, rustfmt

      # anthropics/claude-code-action v1.0.270
      - name: Run Claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed
        with:
          # Uses the owner's Claude subscription (token from `claude setup-token`),
          # not a pay-as-you-go API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "claude/"
          # Only the owner's and the agents' comments reach Claude (public repo).
          # A workflow bot identity does not establish that its comment content
          # is trusted; do not promote arbitrary github-actions[bot] output.
          include_comments_by_actor: "FunKite,chatgpt-codex-connector[bot],claude[bot]"
          # Codex may call Claude on this repository's pull requests (the route
          # job enforces the per-PR limit). No other bot can.
          allowed_bots: "chatgpt-codex-connector"
          claude_args: |
            --model claude-fable-5-2
            --max-turns 40
            --append-system-prompt "Never write @codex or @chatgpt-codex-connector in any comment, review, commit message or pull request text. Mentioning Codex would start a loop between the two agents. If Codex should look again, say so in plain words and leave it to the owner."
            --allowedTools "Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(cargo doc:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"
