name: Boundary Probe

# TEMPORARY test for PR 121's reviewer boundary. Never merge this file.
# Uses the same job permissions as claude-review.yml and checks what the job
# token can and cannot do, plus the subprocess isolation setup.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == github.repository_owner && github.event.pull_request.number == 122 && github.event.pull_request.head.ref == 'codex/claude-boundary-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/checkout v7 (same pin as the other workflows)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test denial classification without network access
        run: python3 -m unittest discover -s scripts/tests -p 'test_agent_boundary_probe.py' -v

      - name: Probe the job token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/agent_boundary_probe.py

      - name: Probe subprocess isolation (same step as the Claude jobs)
        run: |
          set -euo pipefail
          if command -v bwrap >/dev/null; then echo "bwrap preinstalled"; else echo "bwrap not preinstalled"; fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
          echo "bubblewrap $(bwrap --version) works"
