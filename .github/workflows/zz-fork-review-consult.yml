name: Temporary Fork Review Consultation

# One bounded read-only consultation on the unmerged fork-review design.
# Temporary fixture and workflow: never merge into main.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  consult:
    if: github.actor == github.repository_owner && github.event.pull_request.number == 122 && github.event.pull_request.head.ref == 'codex/claude-boundary-test' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load only the public-source consultation fixture
        id: context
        run: |
          python3 - <<'PY'
          import os
          import uuid
          from pathlib import Path
          prompt = Path('docs/agent-fork-review-consultation.txt').read_text()
          delimiter = str(uuid.uuid4())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'prompt<<{delimiter}\n{prompt}\n{delimiter}\n')
          PY

      - name: Install subprocess isolation
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true

      # anthropics/claude-code-action v1.0.270
      - name: Ask Fable for a read-only recommendation
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Runtime output is not re-evaluated as a GitHub expression. Keeping
          # source in a fixture prevents its literal secrets.* references from
          # accidentally becoming credential values in the consultation prompt.
          prompt: ${{ steps.context.outputs.prompt }}
          show_full_output: true
          claude_args: |
            --model claude-fable-5-2
            --max-turns 1
            --safe-mode
            --disable-slash-commands
            --tools "Read"
            --disallowedTools "Read,mcp__github_inline_comment__create_inline_comment"
