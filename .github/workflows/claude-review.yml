name: Claude Review

# Claude Fable 5.2 reviews pull requests that Codex opens (codex/ branches),
# so each agent's work is reviewed by the other. Codex already reviews every
# PR through the ChatGPT Codex connector. Runs once when a codex/ PR is opened
# ready for review or marked ready; ask for another pass with "@claude review".

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'codex/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'FunKite'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # actions/checkout v7 (same pin as the other workflows; see Pin Drift Check)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      # anthropics/claude-code-action v1.0.270
      - name: Claude review
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          include_comments_by_actor: "FunKite,chatgpt-codex-connector[bot],claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request, which Codex wrote, against AGENTS.md and its
            "Review guidelines" section. Read the PR body and any Codex review
            comments first so you do not repeat findings already raised.
            Use inline comments for specific problems, each with a severity
            (P0 to P3) and a concrete fix. Finish with one short summary comment.
            Do not push commits, approve or merge.
          claude_args: |
            --model claude-fable-5-2
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
