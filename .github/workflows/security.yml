name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust_security_audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  security_workflow_audit:
    name: Security Workflow Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Ensure workflow actions are SHA pinned
        run: |
          set -euo pipefail
          bad=0
          while IFS=: read -r file line text; do
            if [[ ! "$text" =~ @([a-f0-9]{40})$ ]]; then
              echo "Non-SHA-pinned action reference: ${file}:${line}: ${text}"
              bad=1
            fi
          done < <(grep -RInE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^[:space:]]+@[^[:space:]]+$' .github/workflows)
          if [[ "$bad" -ne 0 ]]; then
            echo "One or more workflow actions are not pinned to commit SHAs."
            exit 1
          fi

  pin_drift_check:
    name: Pin Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate pinned SHAs match tracked major tags
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local repo="$1"
            local tag="$2"
            local sha
            sha="$(git ls-remote "https://github.com/${repo}.git" "refs/tags/${tag}^{}" | awk '{print $1}')"
            if [[ -z "${sha}" ]]; then
              sha="$(git ls-remote "https://github.com/${repo}.git" "refs/tags/${tag}" | awk '{print $1}')"
            fi
            if [[ -z "${sha}" ]]; then
              echo "Unable to resolve ${repo}@${tag}" >&2
              exit 1
            fi
            echo "${sha}"
          }

          resolve_branch_commit() {
            local repo="$1"
            local branch="$2"
            local sha
            sha="$(git ls-remote "https://github.com/${repo}.git" "refs/heads/${branch}" | awk '{print $1}')"
            if [[ -z "${sha}" ]]; then
              echo "Unable to resolve ${repo}@${branch}" >&2
              exit 1
            fi
            echo "${sha}"
          }

          resolve_local_pin() {
            local pattern="$1"
            local sha
            sha="$(grep -RhoE "${pattern}" .github/workflows | sed -E 's/.*@//' | sort -u)"
            if [[ -z "${sha}" ]]; then
              echo "No local pin found for pattern: ${pattern}" >&2
              exit 1
            fi
            if [[ "$(echo "${sha}" | wc -l | tr -d ' ')" -ne 1 ]]; then
              echo "Multiple local SHAs found for pattern ${pattern}:" >&2
              echo "${sha}" >&2
              exit 1
            fi
            echo "${sha}"
          }

          failures=0

          checkout_expected="$(resolve_tag_commit "actions/checkout" "v7")"
          checkout_pinned="$(resolve_local_pin 'uses:[[:space:]]*actions/checkout@[a-f0-9]{40}')"
          if [[ "${checkout_pinned}" != "${checkout_expected}" ]]; then
            echo "Pin drift: actions/checkout"
            echo "  pinned:   ${checkout_pinned}"
            echo "  expected: ${checkout_expected} (v7)"
            failures=1
          else
            echo "OK: actions/checkout matches v7 (${checkout_expected})"
          fi

          codeql_expected="$(resolve_tag_commit "github/codeql-action" "v4")"
          codeql_pinned="$(resolve_local_pin 'uses:[[:space:]]*github/codeql-action/(init|analyze)@[a-f0-9]{40}')"
          if [[ "${codeql_pinned}" != "${codeql_expected}" ]]; then
            echo "Pin drift: github/codeql-action (init/analyze)"
            echo "  pinned:   ${codeql_pinned}"
            echo "  expected: ${codeql_expected} (v4)"
            failures=1
          else
            echo "OK: github/codeql-action matches v4 (${codeql_expected})"
          fi

          # dtolnay/rust-toolchain has no tags; "stable" etc. are branches that
          # get force-pushed to a new commit on every Rust release, so a pin
          # left unrefreshed eventually points at a commit unreachable from
          # any branch (Dependabot then fails with "no such commit").
          toolchain_expected="$(resolve_branch_commit "dtolnay/rust-toolchain" "stable")"
          toolchain_pinned="$(resolve_local_pin 'uses:[[:space:]]*dtolnay/rust-toolchain@[a-f0-9]{40}')"
          if [[ "${toolchain_pinned}" != "${toolchain_expected}" ]]; then
            echo "Pin drift: dtolnay/rust-toolchain"
            echo "  pinned:   ${toolchain_pinned}"
            echo "  expected: ${toolchain_expected} (stable)"
            failures=1
          else
            echo "OK: dtolnay/rust-toolchain matches stable (${toolchain_expected})"
          fi

          if [[ "${failures}" -ne 0 ]]; then
            echo "One or more workflow action pins have drifted."
            exit 1
          fi
