<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="748" viewBox="0 0 1120 748" role="img" aria-labelledby="title desc">
<title id="title">Solunatus night plan for Tucson on September 15, 2026</title>
<desc id="desc">Real CLI output: evening photography times, a moon-free dark window, and a timed snapshot of Moon and planet positions.</desc>
<rect width="1120" height="748" rx="18" fill="#0c1424"/>
<rect x="1" y="1" width="1118" height="746" rx="18" fill="none" stroke="#30435c"/>
<circle cx="32" cy="30" r="6" fill="#ef8b82"/><circle cx="53" cy="30" r="6" fill="#e9c46a"/><circle cx="74" cy="30" r="6" fill="#81bfa7"/>
<text x="110" y="36" fill="#9cb0c9" font-family="monospace" font-size="16">solunatus · an evening under the stars</text>
<path d="M 22 55 H 1098" stroke="#30435c"/>
<text x="32" y="87" fill="#9adbc6" font-family="monospace" font-size="18">$ solunatus --city Tucson --date 2026-09-15 --tonight</text>
<text x="32" y="130" xml:space="preserve" fill="#8ccdf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">SOLUNATUS / NIGHT PLAN</text>
