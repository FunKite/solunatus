<text x="32" y="182" xml:space="preserve" fill="#9cb0c9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">America/Phoenix · local noon to next noon</text>
<text x="32" y="208" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20"></text>
<text x="32" y="234" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">Golden hour       Tue 17:58 MST → Tue 18:45 MST</text>
<text x="32" y="260" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">Blue hour         Tue 18:45 MST → Tue 18:54 MST</text>
<text x="32" y="286" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">Sunset            Tue 18:30 MST</text>
