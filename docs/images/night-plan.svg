<text x="32" y="338" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">Darkness ends     Wed 04:46 MST</text>
<text x="32" y="364" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">Sunrise           Wed 06:08 MST</text>
<text x="32" y="390" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20"></text>
<text x="32" y="416" xml:space="preserve" fill="#8ccdf5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">FIRST MOON-FREE DARK WINDOW</text>
<text x="32" y="442" xml:space="preserve" fill="#eacf8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">Tue 21:08 MST → Wed 04:46 MST  (7h 37m)</text>
<text x="32" y="468" xml:space="preserve" fill="#9cb0c9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">Sun below -18°; Moon below horizon with a 15-minute buffer.</text>
<text x="32" y="494" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20"></text>
