<text x="32" y="624" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">  Uranus     35.7° altitude    85.9° azimuth</text>
<text x="32" y="650" xml:space="preserve" fill="#e4eaf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">  Neptune    57.8° altitude   180.1° azimuth</text>
