[package]
name = "solunatus"
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
authors = ["Mike McLarney"]
description = "High-precision astronomical calculation library and CLI for sun/moon positions, rise/set times, and lunar phases"
license = "MIT"
repository = "https://github.com/FunKite/solunatus"
homepage = "https://github.com/FunKite/solunatus"
documentation = "https://docs.rs/solunatus"
readme = "README.md"
keywords = ["astronomy", "sun", "moon", "sunrise", "astronomical"]
categories = ["science", "command-line-utilities"]
autobins = false
exclude = [
    "dist/*",
    "*.html",
    "CPU_QUICK_REFERENCE.txt",
    ".cargo/",
    "CLAUDE.md",
    "target-m1max/",
]

# Library configuration (default)
[lib]
name = "solunatus"
path = "src/lib.rs"

# Main CLI binary
[[bin]]
name = "solunatus"
path = "src/main.rs"

[dependencies]
# CLI and terminal UI
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Astronomical calculations - we'll implement custom algorithms
# based on NOAA and Meeus for maximum accuracy

# HTTP for USNO validation and AI insights (optional)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

# Fuzzy search for city picker
fuzzy-matcher = "0.3"

# Error handling
anyhow = "1.0"

# System directories
dirs = "5.0"

# Data parallelism for calendar generation (optional)
rayon = { version = "1.12", optional = true }

[features]
default = ["usno-validation", "ai-insights"]

# Optional Features (require reqwest)
usno-validation = ["dep:reqwest"]  # USNO API validation (--validate flag, 'r' key)
ai-insights = ["dep:reqwest"]      # Ollama AI integration (--ai-insights flag, 'a' key)

# Parallelize multi-day calendar generation across CPU cores (uses rayon)
parallel = ["dep:rayon"]

# Standard release profile (all platforms) - Portable baseline
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false

# M1/M3 Max-optimized profile (Apple Silicon)
# Optimized for 10-core CPU (8 performance + 2 efficiency)
# with 16-core GPU and 32MB L2 cache per performance core
[profile.release-m1-max]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = false
debug = false

# x86_64 with AVX2 (Intel Haswell+, AMD Ryzen+)
[profile.release-x86-64-v3]
inherits = "release"
lto = "fat"
codegen-units = 1

# x86_64 with SIMD only (SSE/SSE2, no AVX2)
[profile.release-x86-64-v2]
inherits = "release"
lto = true

# Generic ARM64 (portable Apple Silicon, Linux ARM, etc.)
[profile.release-aarch64-generic]
inherits = "release"
lto = true
codegen-units = 1

# High-end ARM64 with SVE support (server/workstation)
[profile.release-aarch64-sve]
inherits = "release"
lto = "fat"
codegen-units = 1

# Development profile
[profile.dev]
opt-level = 2
debug = true

# Test profile
[profile.test]
opt-level = 2

# Benchmarking profile
[profile.bench]
inherits = "release"
debug = true
